name: Deploy sales map to GitHub Pages

on:
  push:
    branches:
      - claude/interactive-sales-map-t0ttna
      - claude/future-territories-page-oau2og
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A fresh group name: three runs wedged on the old "pages" group and could not
# be cancelled ("has not been queued yet"), so nothing new could schedule under
# it. cancel-in-progress is false to match GitHub's own Pages starter workflow —
# cancelling a Pages deployment mid-flight is what tends to wedge the group.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
